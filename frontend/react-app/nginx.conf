# nginx.conf —— 反向代理配置：托管前端 + 转发 API
server {
  listen 80;              # 监听 80 端口（对外唯一入口）
  server_name _;          # 匹配任何域名

  # ① 静态文件：React 打包产物
  location / {
    root /usr/share/nginx/html;   # 网页根目录（Dockerfile 里 dist 就放这）
    index index.html;
    try_files $uri /index.html;   # SPA 回退：找不到路径就返回 index.html
  }

  # ①.5 入口文件不缓存：部署新版本后浏览器必须拿到新 index.html（否则还渲染旧 bundle/旧页面）
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # ①.6 带 hash 的静态资源可长缓存：文件名变了才会重新拉，没变就命中缓存
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ② API 转发：/api/* 的请求转给后端容器
  location /api/ {
    proxy_pass http://backend:8000;   # backend = compose 里的服务名
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ③ 流式关键！关掉 Nginx 缓冲，AI 回复才能逐字透传（打字机）
    proxy_buffering off;
    proxy_read_timeout 300s;   # AI 回复慢，超时放宽到 5 分钟
  }
}