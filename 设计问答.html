<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>project5 设计问答 · 菜鸟教程式手册</title>
<style>
/* ========== 设计令牌 ========== */
:root{
  --accent:#059669;
  --accent-dark:#047857;
  --accent-soft:#ecfdf5;
  --bg:#f5f7f6;
  --surface:#ffffff;
  --text:#1f2937;
  --muted:#64748b;
  --border:#e5e9f0;
  --sidebar-bg:#ffffff;
  --sidebar-text:#475569;
  --sidebar-hover:#f2faf6;
  --sidebar-active-bg:#ecfdf5;
  --sidebar-active-text:#047857;
  --sidebar-border:#e5e9f0;
  --code-bg:#f2faf6;
  --code-text:#0f3d2e;
  --code-border:#d3ece2;
  --code-inline-bg:#f2faf6;
  --code-inline-text:#047857;
  --note-bg:#f2f8f5;
  --note-border:#5a8f7a;
  --tip-bg:#ecfdf5;
  --tip-border:#059669;
  --warn-bg:#fff7e8;
  --warn-border:#e8a33d;
  --header-bg:#ffffff;
  --header-text:#1f2937;
  --header-sub:#64748b;
  --table-head-bg:#f1f5f9;
  --table-head-text:#334155;
}
body.dark{
  --accent:#5db98f;
  --accent-dark:#8fd4b2;
  --accent-soft:#1b2f27;
  --bg:#0f1a16;
  --surface:#15241e;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:#223830;
  --sidebar-bg:#0f1a16;
  --sidebar-text:#cbd5e1;
  --sidebar-hover:#1a2d24;
  --sidebar-active-bg:#234034;
  --sidebar-active-text:#8fd4b2;
  --sidebar-border:#1a2d24;
  --code-bg:#14271f;
  --code-text:#cfe8da;
  --code-border:#234034;
  --code-inline-bg:#1b2f27;
  --code-inline-text:#8fd4b2;
  --note-bg:#16281f;
  --note-border:#5a8f7a;
  --tip-bg:#1b2f27;
  --tip-border:#5db98f;
  --warn-bg:#2b2315;
  --warn-border:#e8a33d;
  --header-bg:#0f1a16;
  --header-text:#e2e8f0;
  --header-sub:#94a3b8;
  --table-head-bg:#1b2f27;
  --table-head-text:#e2e8f0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.75;
  transition:background .2s,color .2s;
}
/* ========== 顶栏 ========== */
.header{
  height:56px;background:var(--header-bg);color:var(--header-text);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;position:fixed;top:0;left:0;right:0;z-index:50;
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.header .brand{display:flex;align-items:center;gap:12px;}
.header .logo{
  width:30px;height:30px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;
}
.header h1{font-size:17px;font-weight:600;}
.header .sub{font-size:12px;color:var(--header-sub);margin-top:1px;}
.header .tools{display:flex;align-items:center;gap:10px;}
.btn{
  border:1px solid var(--border);background:transparent;color:var(--muted);
  padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}

/* ========== 布局 ========== */
.wrap{display:flex;padding-top:56px;height:100%;}
/* 侧边栏 */
.sidebar{
  width:320px;min-width:320px;background:var(--sidebar-bg);color:var(--sidebar-text);
  overflow-y:auto;padding:14px 10px 40px;height:calc(100vh - 56px);
  position:sticky;top:56px;border-right:1px solid var(--sidebar-border);scrollbar-width:thin;
}
.sidebar .search{
  width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;margin-bottom:12px;outline:none;
}
.sidebar .search:focus{border-color:var(--accent);}
.sidebar .search::placeholder{color:var(--muted);}
.sidebar .count{font-size:12px;color:var(--muted);padding:0 4px 8px;}
/* 导航树 */
.tree{list-style:none;}
.top + .top{margin-top:12px;border-top:1px solid var(--sidebar-border);padding-top:12px;}
.top-header{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:6px;
  cursor:pointer;font-size:14px;font-weight:700;color:var(--text);user-select:none;
}
.top-header:hover{background:var(--sidebar-hover);}
.top-header .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);flex-shrink:0;}
.top-header .arrow{font-size:10px;transition:transform .15s;width:12px;color:var(--muted);}
.top-header .gname{flex:1;min-width:0;}
.top-header .gcount{
  font-size:11px;font-weight:500;color:var(--muted);flex-shrink:0;
  background:var(--sidebar-hover);border:1px solid var(--sidebar-border);
  padding:0 8px;border-radius:10px;line-height:17px;
}
.top.collapsed .arrow{transform:rotate(-90deg);}
.top.collapsed .top-items{display:none;}
.top-items{list-style:none;padding-left:10px;}
.group + .group{margin-top:2px;}
.group-header{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--sidebar-text);user-select:none;
}
.group-header:hover{background:var(--sidebar-hover);color:var(--text);}
.group-header .arrow{font-size:9px;transition:transform .15s;width:12px;color:var(--muted);flex-shrink:0;}
.group-header .gname{flex:1;min-width:0;}
.group-header .gcount{
  font-size:11px;font-weight:500;color:var(--muted);flex-shrink:0;
  background:var(--sidebar-hover);border:1px solid var(--sidebar-border);
  padding:0 8px;border-radius:10px;line-height:17px;
}
.group.collapsed .arrow{transform:rotate(-90deg);}
.group.collapsed .group-items{display:none;}
.group-items{list-style:none;padding-left:10px;}
.group-items li a{
  display:flex;gap:7px;align-items:flex-start;padding:6px 10px 6px 14px;border-radius:6px;color:var(--sidebar-text);
  text-decoration:none;font-size:13px;line-height:1.5;border-left:2px solid transparent;
}
.group-items li a:hover{background:var(--sidebar-hover);color:var(--text);}
.group-items li a.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);border-left-color:var(--accent);font-weight:600;}
.group-items li a .qid{
  font-family:Consolas,monospace;font-size:11px;opacity:.65;flex-shrink:0;
  min-width:40px;padding-top:2px;
}

/* 内容区 */
.content{flex:1;overflow-y:auto;padding:28px 40px 16px;min-width:0;display:flex;flex-direction:column;}
.qas{max-width:860px;margin:0 auto;width:100%;flex:1;}
.modpage{display:none;}
.modpage.show{display:block;animation:fade .2s;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.mod-title{
  font-size:12px;color:var(--muted);margin-bottom:22px;padding-bottom:10px;
  border-bottom:1px solid var(--border);letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;
}
.mod-lv1{color:var(--accent);font-weight:700;font-size:13px;}
.mod-arrow{opacity:.5;}
.mod-lv2{font-weight:600;color:var(--text);font-size:13px;}
.mod-count{margin-left:auto;font-size:11.5px;color:var(--muted);}
.qa{display:block;}
.qa-sep{border:none;border-top:1px dashed var(--border);margin:30px 0;}
.qa:first-child{margin-top:0;}

/* 可运行示例 */
.run-example{margin:18px 0;}
.run-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.run-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.5px;}
.run-btn{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  font-size:12.5px;font-weight:600;padding:5px 16px;border-radius:6px;
  cursor:pointer;transition:.15s;
}
.run-btn:hover{opacity:.88;}
.run-btn:disabled{opacity:.5;cursor:wait;}
.run-out{
  display:none;margin-top:8px;padding:12px 14px;border-radius:8px;
  background:#0f2a20;color:#cde8db;font-family:Consolas,monospace;
  font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
body.dark .run-out{background:#0a1a13;border:1px solid #1e3a2d;}

/* 题目测试 */
.quiz{margin:24px 0 4px;border:1px dashed var(--border);border-radius:10px;padding:14px 16px;background:rgba(5,150,105,.04);}
body.dark .quiz{background:rgba(93,185,143,.08);}
.quiz-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.quiz-head .hl{font-size:12.5px;font-weight:700;color:var(--accent-dark);letter-spacing:.5px;}
.quiz-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:2px 10px;}
.quiz-show{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent-dark);background:var(--accent-soft);border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;transition:.15s;}
.quiz-show:hover{opacity:.85;}
.quiz-q{font-size:14px;font-weight:600;margin:2px 0 10px;line-height:1.6;}
.quiz-opts{display:flex;flex-direction:column;gap:6px;}
.quiz-opt{
  display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.5;
  padding:7px 12px;border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:.15s;user-select:none;
}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt .mark{width:18px;height:18px;flex:none;border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.quiz-opt.right{border-color:#16a34a;background:#f0fdf4;color:#14532d;}
.quiz-opt.right .mark{background:#16a34a;border-color:#16a34a;}
.quiz-opt.wrong{border-color:#dc2626;background:#fef2f2;color:#7f1d1d;}
.quiz-opt.wrong .mark{background:#dc2626;border-color:#dc2626;}
.quiz-opt.locked{cursor:default;}
.quiz-opt.locked:hover{border-color:var(--border);}
body.dark .quiz-opt.right{background:#052e16;border-color:#16a34a;color:#86efac;}
body.dark .quiz-opt.wrong{background:#2a0a0a;border-color:#dc2626;color:#fca5a5;}
.quiz-answer{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--text);font-size:12.5px;line-height:1.7;}
body.dark .quiz-answer{background:#1b2f27;}
.quiz-answer.show{display:block;}
.badge{
  display:inline-block;font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent-dark);margin-bottom:10px;
  border:1px solid rgba(5,150,105,.25);
}
body.dark .badge{background:var(--accent-soft);color:var(--accent-dark);}
.qa h2{font-size:22px;font-weight:700;margin-bottom:6px;line-height:1.4;}
.qa .qid-line{font-family:Consolas,monospace;font-size:13px;color:var(--muted);margin-bottom:18px;}
.qa .answer{font-size:15px;}
.qa .answer p{margin-bottom:12px;}
.qa .answer ul,.qa .answer ol{margin:0 0 12px 22px;}
.qa .answer li{margin-bottom:6px;}
.qa .answer strong{color:var(--text);}
.qa .answer em{color:var(--muted);font-style:normal;}

/* 代码 */
pre.code{
  background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:8px;
  overflow-x:auto;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;
  margin:12px 0;border:1px solid var(--code-border);white-space:pre;
}
code.inline{
  background:var(--code-inline-bg);color:var(--code-inline-text);padding:1px 6px;border-radius:4px;
  font-family:Consolas,monospace;font-size:13px;
}

/* 提示框 */
.box{border-radius:8px;padding:12px 16px;margin:14px 0;border-left:4px solid;font-size:14px;}
.box .box-title{font-weight:700;font-size:13px;margin-bottom:4px;}
.box.note{background:var(--note-bg);border-color:var(--note-border);}
.box.note .box-title{color:var(--note-border);}
.box.tip{background:var(--tip-bg);border-color:var(--tip-border);}
.box.tip .box-title{color:var(--tip-border);}
.box.warn{background:var(--warn-bg);border-color:var(--warn-border);}
.box.warn .box-title{color:var(--warn-border);}

/* 上一步/下一步（吸底） */
.pager{
  position:sticky;bottom:0;z-index:5;
  display:flex;justify-content:space-between;gap:12px;
  max-width:860px;width:100%;margin:auto auto 0;
  background:var(--bg);border-top:1px solid var(--border);
  padding:14px 0 8px;
}
.pager button{
  flex:1;padding:12px 16px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);border-radius:8px;cursor:pointer;font-size:14px;transition:.15s;
  text-align:left;box-shadow:0 2px 6px rgba(16,24,40,.05);
}
.pager button:hover{border-color:var(--accent);color:var(--accent);}
.pager button:disabled{opacity:.4;cursor:default;border-color:var(--border);color:var(--muted);}
.pager .dir{font-size:12px;color:var(--muted);display:block;}
.pager .name{font-weight:600;font-size:13.5px;}

/* 表格（库辨析、结构地图） */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
th{background:var(--table-head-bg);color:var(--table-head-text);text-align:left;padding:9px 12px;font-weight:600;font-size:13px;}
td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top;}
tr:nth-child(even) td{background:rgba(0,0,0,.02);}
body.dark tr:nth-child(even) td{background:rgba(255,255,255,.02);}

/* 树形结构图 */
.tree-code{font-family:Consolas,monospace;font-size:13px;line-height:1.65;white-space:pre;overflow-x:auto;}
.tree-code .t-comment{color:var(--muted);}

/* 移动端 */
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:56px;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:none;}
  .menu-btn{display:inline-block !important;}
  .content{padding:20px 16px 60px;}
}
.menu-btn{display:none;}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <button class="btn menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo">P5</div>
    <div>
      <h1>project5 设计问答</h1>
      <div class="sub">AI 知识库平台 · 边学边记的 Q&amp;A 手册</div>
    </div>
  </div>
  <div class="tools">
    <button class="btn" onclick="toggleDark()">🌓 深色</button>
  </div>
</div>

<div class="wrap">
  <!-- ========== 左侧导航 ========== -->
  <aside class="sidebar" id="sidebar">
    <input class="search" id="search" type="text" placeholder="🔍 搜索问题…（如：隔离 / 中间件 / 反向传播）">
    <div class="count" id="count"></div>
    <ul class="tree" id="tree"></ul>
  </aside>

  <!-- ========== 右侧内容 ========== -->
  <main class="content">
    <div class="qas" id="qas"></div>
  </main>
</div>

<script>
/* ================================================================
 * 数据：每个条目 = 一个 Q&A 小节
 * ================================================================ */
const MODULES = [
  { name:"基础部分", groups:[
  { name:"Python 收尾", items:[
    { id:"w1-1", q:"W1-1. Python 收尾四件套：装饰器 / dataclass / 注解 / async", badge:"基础 · Python", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>装饰器=包一层改行为（@app.post/@tool 都是它）；dataclass 少写 __init__，HTTP 场景用 Pydantic；注解标类型给 IDE 看，运行时不管；async 等待时让出 CPU，漏 await 或同步阻塞会卡事件循环</strong></div>
      <ul>
        <li><strong>装饰器</strong> = 包一层改行为：<code class="inline">@app.post</code> 注册路由、<code class="inline">@tool</code> 让模型看得见；本质 <code class="inline">@timer == fn=timer(fn)</code></li>
        <li><strong>dataclass</strong> = 少写 <code class="inline">__init__</code>（自动送 repr/eq）；跟 HTTP 打交道用 <strong>Pydantic</strong>——校验 + 序列化，FastAPI 的 422 就靠它</li>
        <li><strong>注解</strong> = 标类型给 IDE 看，运行时不强制；<code class="inline">str|None</code> 写法</li>
        <li><strong>async/await</strong> = 等待时让出 CPU 不干坐；漏写 await 或同步阻塞（<code class="inline">time.sleep</code> / <code class="inline">requests.get</code>）都卡事件循环；<code class="inline">async for</code> 边等边读流</li>
      </ul>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
import time

def timer(fn):                      # @timer 的本质：fn = timer(fn)，包一层改行为
    def wrap(*args, **kwargs):
        t = time.perf_counter()
        r = fn(*args, **kwargs)
        print(f'{fn.__name__}() 耗时 {time.perf_counter() - t:.4f}s')
        return r
    return wrap

@timer
def slow(x):
    time.sleep(0.2)
    return x * 2

print('结果 =', slow(21))
</pre>
        <div class="run-out"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">装饰器 @timer 的本质是什么？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>让 Python 运行时自动加速函数</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>fn = timer(fn)，把函数包一层改行为</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>声明函数的返回类型</div>
        </div>
        <div class="quiz-answer">✅ 装饰器=包一层改行为，@timer 等价于 fn = timer(fn) 后重新绑定原名字</div>
      </div>`
 }
  ]},
  { name:"机器学习 · L1-L8", items:[
    { id:"w1-2", q:"W1-2. ML · KNN 核心（L1）", badge:"基础 · 机器学习", html:`
      <p>KNN = 预测(分类)算法，不学参数，纯靠<strong>距离 + 邻居投票</strong>。</p>
      <ul>
        <li><strong>五步流程</strong>：加载 → 切分(80/20，测试集必须没见过) → fit(记住数据) → predict → 评估准确率</li>
        <li><strong>K = 数几个邻居投票</strong>（不是相似度！），k 小过拟合、k 大欠拟合</li>
        <li><strong>距离度量</strong>：欧氏 = 直线、曼哈顿 = 折线（RAG 余弦相似度是同类思想）</li>
        <li><strong>fit = 学习，但学的对象各不同</strong>：KNN 记数据、StandardScaler 学均值/方差、LinearRegression 学系数</li>
      </ul>

      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">KNN 里的 K 指的是？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>相似度阈值</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>找几个邻居投票（n_neighbors）</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>交叉验证切几份</div>
        </div>
        <div class="quiz-answer">✅ K = 数几个邻居投票；交叉验证的 K（cv）才是切几份</div>
      </div>` },
    { id:"w1-3", q:"W1-3. ML · 标准化 + 交叉验证（L1-L2）", badge:"基础 · 机器学习", html:`
      <ul>
        <li><strong>标准化解决量纲不一致</strong>：0-100 的身高会欺负 0-1 的体重</li>
        <li><strong>归一化</strong> = [0,1]，用 min/max；<strong>标准化</strong> = 均值 0 方差 1，用 Z-score（更常用、不怕异常值）</li>
        <li>KNN/SVM/逻辑回归/神经网络<strong>必做</strong>；决策树/随机森林<strong>不用</strong></li>
        <li><strong>测试集只 transform 不 fit</strong>（防考试偷看答案，面试高频）</li>
        <li><strong>交叉验证</strong> = 反复切训练集多轮轮流当验证集，得分更可信：验证集选参数用、测试集最终成绩用</li>
      </ul>
      <div class="box warn"><div class="box-title">实测反例</div>手写数字 64 特征本就同量纲：标准化后 0.9694 vs 不标准化 0.9833——无收益反而略降。<strong>标准化不是无脑做，先看特征尺度</strong>。GridSearchCV 自动找最佳 k=3。</div>

        <div class="quiz-opt" data-ci="1"><span class="mark"></span>防止测试集信息泄露进训练（偷看答案）</div>

      </div>` },
    { id:"w1-4", q:"W1-4. ML ⚠️ 易混 · 两个 K 搞混", badge:"基础 · 机器学习", html:`
      <ul>
        <li><strong>KNN 的 K</strong>（n_neighbors）= 找几个邻居投票，如 k=3 是最近的 3 个邻居</li>
        <li><strong>交叉验证的 K</strong>（cv）= 数据切几份轮流考试，如 cv=5 是切 5 份、5 轮</li>
      </ul>
      <p>120 条 + cv=5：每轮训练 96 条、验证 24 条。GridSearchCV = 把所有候选参数（k=1,3,5...）各跑一遍交叉验证，选得分最高的。</p>
      <div class="box tip"><div class="box-title">一句话</div><strong>交叉验证是「考卷」，k 是「学生」，网格搜索是「拉所有学生考一遍选最好的」</strong>。</div>
      
      <div class="quiz">

        <div class="quiz-opt" data-ci="0"><span class="mark"></span>训练 5 个不同的模型</div>
        </div>
        <div class="quiz-answer">✅ cv = 交叉验证的 K = 切几份轮流考试；KNN 的 K 才是邻居数</div>
      </div>` },
    { id:"w1-5", q:"W1-5. ML · 线性回归（L3）", badge:"基础 · 机器学习", html:`
      <ul>
        <li>回归 = 画一条让误差最小的直线 <code class="inline">y = wx + b</code>（w 斜率、b 截距）；fit 学的是 w/b</li>
        <li>最合适 = 让 <strong>MSE 最小</strong>的线：MSE = 误差²取平均（损失函数本体，手算 = sklearn 同为 808.8）</li>
        <li><strong>指标三兄弟</strong>：RMSE = √MSE 救回单位（平均偏 28.4 万）；MAE = 绝对值平均（22.2 万，不放大）；R² = 比瞎猜均值好多少（0.918）</li>
        <li><strong>找解两条路</strong>：正规方程 = 求导一步精确解（特征少用、零参数可调）；梯度下降 = 闭眼下坡迭代逼近（数据大 / 深度学习用）</li>
      </ul>
      <div class="box warn"><div class="box-title">易混</div>回归输出<strong>连续数值</strong> ≠ 分类输出<strong>类别</strong>；LinearRegression 没有 K 可调（最优解直接能算出）。</div>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
# MSE 手算：每个误差平方后取平均（sklearn 的 LinearRegression 内部就在最小化它）
y_true = [3.0, -0.5, 2.0, 7.0]
y_pred = [2.5, 0.0, 2.0, 8.0]

mse = sum((y - p) ** 2 for y, p in zip(y_true, y_pred)) / len(y_true)
print('MSE  =', mse)
print('RMSE =', round(mse ** 0.5, 3))   # 开根号救回原单位
</pre>
        <div class="run-out"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>

    { id:"w1-6", q:"W1-6. ML · 欠/过拟合 + 正则化（L4）", badge:"基础 · 机器学习", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>欠拟合=没学够（两边都低）；过拟合=背住训练集（训练高测试崩）；正则化 L2 压小权重、L1 压成 0 自动选特征；α 像 KNN 的 k 一样要调</strong></div>
      <ul>
        <li><strong>欠拟合</strong> = 太简单没学够（训练/测试都低：deg1-2 约 0.52-0.57）</li>
        <li><strong>过拟合</strong> = 背住训练集（训练高、测试崩：deg=15 训练 0.979、测试 R²=-540！）</li>
        <li><strong>判断口诀</strong>：训练高 + 测试高 = 好；训练高 + 测试崩 = 过拟合</li>
        <li><strong>对策 = 正则化罚款</strong>：L2(Ridge) 权重压小不归零；L1(Lasso) 直接压成 0 自动选特征（15 个系数只剩 1 个非 0）</li>
        <li><strong>α = 惩罚力度</strong>：太小没用、太大会压死有用特征（α=1.0 测试 R² 反降）→ α 就是「回归版需要调的参数」，同 KNN 的 k 一样走交叉验证</li>
        <li><strong>梯度下降复习</strong>：学习率 = 步长，lr=0.1 稳步逼近 vs lr=0.9 来回震荡（5.40→1.08→4.54→1.77→3.98）</li>
      </ul>

      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">过拟合的判断口诀是？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>两边都低</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>训练高 + 测试崩</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>训练低 + 测试高</div>
        </div>
        <div class="quiz-answer">✅ 训练高+测试高=好；训练高+测试崩=过拟合；两边都低=欠拟合</div>
      </div>` },
    { id:"w1-7", q:"W1-7. ML · 逻辑回归（L5）", badge:"基础 · 机器学习", html:`
      <p>名字叫回归，其实是<strong>分类</strong>！线性回归输出 (-∞,+∞) 没法当概率 → <strong>sigmoid</strong> 把 <code class="inline">z = w·x + b</code> 压进 (0,1)，&gt;0.5 判 1。</p>
      <ul>
        <li><strong>混淆矩阵</strong> [[TN,FP],[FN,TP]]：TN/TP = 判对、FP = 误报、FN = 漏报（最要命）；准确率 = (TN+TP)/全部 = 0.974</li>
        <li><strong>精确率</strong> = TP/(TP+FP) = 0.976，管误报（判患癌里的人真有病）；<strong>召回率</strong> = TP/(TP+FN) = 0.953，管漏报（真病人里找出来多少）；两者必然此消彼长</li>
        <li><strong>阈值 = 松紧旋钮</strong>：调低 → 召回升精确降（筛查宁抓错不放过 0.3）；调高 → 更保守（0.7 精确=1.0）</li>
        <li><strong>AUC</strong> = ROC 曲线下面积 = 所有阈值整体分辨力 0.997；0.5 = 瞎猜、1 = 完美</li>
      </ul>
      <div class="box warn"><div class="box-title">易混三连</div><strong>准确率 ≠ 精确率 ≠ 召回率</strong>。</div>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
import math

def sigmoid(z):
    return 1 / (1 + math.exp(-z))   # 把 (-inf,+inf) 压进 (0,1)

def score(x1, x2):                  # 线性部分 z = w*x + b
    return 0.5 * x1 - 1.2 * x2 + 0.3

for x1, x2 in [(2, 1), (1, 3), (0, 0)]:
    p = sigmoid(score(x1, x2))
    print(f'x=({x1},{x2})  概率={p:.3f}  -&gt;  {"患病" if p &gt; 0.5 else "健康"}')
</pre>
        <div class="run-out"></div>
      </div>
      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">召回率管的是什么？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>误报——判患癌里的水分</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>漏报——真病人里找出多少</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>整体准确率</div>
        </div>
        <div class="quiz-answer">✅ 精确率管误报 TP/(TP+FP)，召回率管漏报 TP/(TP+FN)，两者此消彼长</div>
      </div>`
 },
    { id:"w1-8", q:"W1-8. ML · 决策树（L6）", badge:"基础 · 机器学习", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>树=一层层 if-else 规则集；熵=不确定度（越纯越低）；每步挑信息增益最大的特征切；剪枝 max_depth 治过拟合</strong></div>
      <ul>
        <li>树 = 一层层 if-else 叠出的规则集，可解释性最强（根到叶每条路 = 一条人话规则）</li>
        <li><strong>熵 = 不确定度</strong>：全 A = 0（最纯）、2A2B = 1（最乱）；树的目标 = 切得越来越纯、熵一路下降</li>
        <li><strong>信息增益</strong> = 父熵 - (左占比·左熵 + 右占比·右熵) = 切开后的纯度提升量；建树 = 每一步挑增益最大的特征切</li>
        <li><strong>过拟合演示</strong>：depth=1 测试 0.611 欠拟合 / depth=3 0.963 均衡 / None 训练 1.000 背答案 → 剪枝 <code class="inline">max_depth</code>（同 L4 的 α，一个压权重一个砍树）</li>
        <li><strong>三种树一句记</strong>：ID3 = 信息增益（偏爱取值多特征）、C4.5 = 增益率（给多取值打折修正）、CART = 基尼指数（sklearn 默认，还支持回归）</li>
      </ul>

      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">熵 = 0 表示什么？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>数据最乱</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>数据最纯（全是一类）</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>特征数量最多</div>
        </div>
        <div class="quiz-answer">✅ 全 A 熵=0 最纯，2A2B 熵=1 最乱；树的目标是切得越来越纯</div>
      </div>` },
    { id:"w1-9", q:"W1-9. ML · 集成学习（L7）", badge:"基础 · 机器学习", html:`
      <ul>
        <li>集成 = 一群弱模型变强：500 棵 depth1 树桩投票 测试 0.895→0.939（投票把个别树的错淹掉）</li>
        <li><strong>Bagging</strong> = 并行 + 放回抽样 + 投票 → 降方差/治过拟合；<strong>随机森林</strong> = Bagging + 每棵树只看随机特征 → 树更不相似、错不重叠（0.956→0.965）</li>
        <li><strong>Boosting</strong> = 串行错题集：后一棵专补前一棵答错的样本 → 降偏差/治欠拟合；AdaBoost 200 轮测试 0.974 本例最强；GBDT = 每棵新树拟合上一轮残差 = L4 梯度下降换个形式（函数空间下坡）</li>
      </ul>
      <div class="box tip"><div class="box-title">面试模板</div><strong>Bagging（并行 / 投票 / 方差）vs Boosting（串行 / 补错 / 偏差）</strong>；树模型不用标准化（对尺度不敏感，对比 L2 KNN 必须标准化）。</div>
      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">Bagging 和 Boosting 的核心区别？</div>
        <div class="quiz-opts">
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>Bagging 串行、Boosting 并行</div>
        <div class="quiz-opt" data-ci="1"><span class="mark"></span>Bagging 并行投票降方差；Boosting 串行补错降偏差</div>
        <div class="quiz-opt" data-ci="0"><span class="mark"></span>两者都只降偏差</div>
        </div>
        <div class="quiz-answer">✅ Bagging=并行+放回抽样+投票→降方差；Boosting=串行错题集→降偏差</div>
      </div>` },
    { id:"w1-10", q:"W1-10. ML · 朴素贝叶斯 + XGBoost（L8）", badge:"基础 · 机器学习", html:`
      <ul>
        <li><strong>朴素贝叶斯</strong> = 贝叶斯公式 + 特征独立假设：<code class="inline">P(类|特征) = 似然×先验÷证据</code>，谁大判给谁；训练 = 统计频数（秒级）；优点小样本/能出概率/几乎免调参，缺点特征强相关会偏（独立假设常不成立）</li>
        <li><strong>XGBoost</strong> = GBDT 工程加强版（面试五点）：正则化项防过拟合、二阶导牛顿法收敛更快、列抽样、内置缺失值处理、并行直方图</li>
        <li><strong>全家福</strong>：朴素贝叶斯 0.974 = AdaBoost 0.974 &gt; 随机森林 0.965 &gt; XGBoost 0.956 → 小数据上简单模型追平反超</li>
      </ul>
      <div class="box tip"><div class="box-title">面试答案</div><strong>数据越大、特征越多，XGBoost 优势越明显</strong>。</div>
      
      <div class="quiz">
        <div class="quiz-head">📝 自我测试 <span class="quiz-tag">可选 · 点选项判分</span><button class="quiz-show" onclick="showAnswer(this)">显示答案</button></div>
        <div class="quiz-q">朴素贝叶斯"朴素"在哪里？</div>
        <div class="quiz-opts">

        <div class="quiz-opt" data-ci="1"><span class="mark"></span>假设特征相互独立</div>

      </div>` },

  { name:"深度学习概念", items:[
    { id:"h1", q:"H1. 感知机是什么？", badge:"模块 H", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>感知机=加权投票器：权重×输入 求和过阈值出 0/1；单兵只能分直线，一堆拼成神经网络</strong></div>

        <li>单个感知机只能画"直线"分两类（线性）；<strong>一堆拼起来 = 神经网络</strong>，才能处理复杂问题。记忆：感知机是砖，神经网络是墙。</li>
        <li>生活例子：周末出门决策——天气 3 分、心情 2 分、预算 2 分，加权和 ≥5 出门。</li>
      </ul>
      
      <div class="quiz">

    { id:"h2", q:"H2. 反向传播是什么？（训练机制）", badge:"模块 H", html:`
      <ul>
        <li><strong>是什么</strong>：回答"几百万个权重怎么知道往哪调"——误差从输出层<strong>往回</strong>逐层分摊到每个权重，按贡献调参。</li>
        <li><strong>四步循环</strong>：前向（数据过一遍网络）→ 算误差（预测 vs 正确答案差多少）→ 回传分摊（谁贡献大谁被调得多）→ 更新权重。重复百万次，误差越调越小。</li>
        <li><strong>易错点（复盘纠正）</strong>：调整量看<strong>对误差的贡献度（梯度）</strong>，不看权重本身大小——像考砸复盘重点补"失分最多的知识点"，不是"讲得最轻的"。</li>
        <li><strong>和已学知识的联系</strong>：权重更新 <code class="inline">w_new = w_old − 学习率 × 梯度</code> 就是线性回归（L3）里的<strong>梯度下降</strong>同款公式。反向传播 = 多层嵌套的梯度下降（梯度用链式法则穿过每一层）。</li>
      </ul>
      <div class="box tip"><div class="box-title">一句话</div><strong>反向传播 = 多层回归训练，每一层都在做梯度下降</strong>。</div>

        <li><strong>2026 趋势（了解）</strong>：Agentic RAG（检索作为 Agent 工具）、GraphRAG（知识图谱多跳）、Hybrid Search + Reranker 已成生产标配</li>

      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
# 模拟 RAG 检索：余弦相似度 top-k（不依赖任何库）
docs = [
  "FastAPI 用依赖注入管理数据库会话",
  "装饰器是包一层改函数行为",
  "向量数据库按相似度秒级检索 top-k",
  "Docker 用 Compose 一键编排多个容器",
]
q = "怎么按相似度快速找文档？"

def cosine(a, b):
    dot = sum(x*y for x, y in zip(a, b))
    na = sum(x*x for x in a) ** 0.5
    nb = sum(x*x for x in b) ** 0.5
    return dot / (na * nb) if na and nb else 0

# 简易词袋向量（含关键词就算 1）
import re
def vec(t):
    words = set(re.findall(r"[\u4e00-\u9fa5]+", t))
    return {w: 1 for w in words}

qv = vec(q)
scores = []
for d in docs:
    dv = vec(d)
    keys = set(qv) | set(dv)
    a = [qv.get(k, 0) for k in keys]
    b = [dv.get(k, 0) for k in keys]
    scores.append((cosine(a, b), d))
scores.sort(reverse=True)
for s, d in scores[:2]:
    print(f"{s:.2f}  {d}")

        <li><strong>ReAct = Reason + Act</strong>：一边推理（要查什么）一边行动（调工具），观察结果再决定下一步</li>

        <pre class="code">
# 模拟 ReAct 循环：思考→行动→观察，直到 LLM（模拟器）直接回答
def llm(thought, tools, memories):
    # 模拟模型决策：想查温度就调工具，否则直接答
    if "温度" in thought:
        return {"action": "get_temperature", "action_input": "上海"}
    return {"action": "answer", "answer": "上海今天 28 度"}

def run_tool(name, arg):
    if name == "get_temperature":
        return "28 度，多云"     # 工具观察结果
    return "未知工具"

tools = {"get_temperature": run_tool}
memories = []
thought = "用户想知道上海温度，需要先查工具"
step = 0
while step < 5:                       # 循环上限保护
    step += 1
    print(f"[思考 {step}] {thought}")
    dec = llm(thought, tools, memories)
    if dec["action"] == "answer":
        print(f"[回答] {dec['answer']}")
        break
    obs = tools[dec["action"]](dec["action"], dec["action_input"])
    print(f"[行动] 调 {dec['action']}({dec['action_input']}) → [观察] {obs}")
    thought = "已经查到" + str(obs) + "，直接回答即可"
</pre>

        <li><strong>流式</strong>：<code class="inline">stream=True</code>，for chunk 循环逐字打印——前端体验的关键</li>
        <li><strong>temperature</strong>：0 = 最确定（答题/JSON 用）；1 = 更发散（创意用）；结构化输出调低 JSON 才稳</li>
        <li><strong>易混</strong>：流式 ≠ 非流式字段不同——流式读 delta.content，非流式读 message.content</li>
      </ul>

    for i in range(0, len(text), size):
        yield text[i:i + size]

for chunk in fake_stream("结构化输出请把 temperature 调低到 0 附近"):
    print(chunk, end="", flush=True)
print()
print("（真实代码里是 for chunk in response: 读 delta.content）")

    def __getattr__(self, k): return self[k]

      <ul>
        <li><strong>模式</strong>：supervisor 读任务 → 派给 specialist worker → 收摘要 → 再决策下一个</li>
        <li><strong>好处</strong>：各 worker 上下文隔离，主窗口不被中间过程刷屏；规模可控（不做企业超级平台）</li>
        <li><strong>落地形态</strong>（企业场景 AI 任务自动化）：分析 Agent → 检索 Agent → 执行 Agent → 审核 Agent → 生成报告，每步一个 Agent 各司其职</li>

# 模拟 Supervisor 多智能体：调度者派活，worker 回摘要
def supervisor(task):
    workers = [
        ("分析Agent",   lambda: "分析：磁盘 IO 高"),
        ("检索Agent",   lambda: "检索：手册第 3 章"),
        ("执行Agent",   lambda: "执行：清理缓存"),
        ("审核Agent",   lambda: "审核：通过，风险低"),
    ]
    report = []
    for name, work in workers:
        print(f"[Supervisor] 派给 {name}")
        summary = work()
        report.append(f"{name}: {summary}")
        print(f"  {name} 回摘要：{summary}")
    print("最终报告：", " -> ".join(report))

supervisor("处理磁盘告警")
</pre>

    { id:"k17", q:"F17. React 学到的核心是什么？", badge:"前端 · React", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>组件 = 函数 + JSX；状态用 useState；数据单向流动 props；异步用 fetch；LLM 流式用 ReadableStream 逐块渲染</strong></div>
      <ul>
        <li><strong>组件化</strong>：页面拆成小组件（函数 + JSX），复用和改起来都方便</li>
        <li><strong>状态</strong>：useState 管理组件状态；改状态触发重新渲染（不是手动改 DOM）</li>
        <li><strong>数据流</strong>：父组件通过 props 传给子组件，单向流动</li>
        <li><strong>流式响应</strong>：fetch 拿到 Response.body（ReadableStream），循环读 chunk 逐块 append 到界面——打字机效果</li>
      </ul>
      <pre class="code">// React 核心三件：组件函数 + useState + props（JS 示例，理解即可）
function Chat() {
  const [messages, setMessages] = useState([]);   // 状态：改它触发重渲染
  const [text, setText] = useState("");

  async function send() {
    setMessages([...messages, { role: "user", content: text }]);
    const res = await fetch("/api/chat", { method: "POST",
        body: JSON.stringify({ text }) });
    const reader = res.body.getReader();          // 流式读 LLM 回复
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      setMessages((m) => [...m, { role: "assistant", content: decode(value) }]);
    }
  }
  return &lt;ul&gt;{messages.map((m) =&gt; &lt;li&gt;{m.content}&lt;/li&gt;)}&lt;/ul&gt;;
}</pre>

      <pre class="code"># Docker 多阶段构建：build 装依赖 → runtime 只拷产物
FROM python:3.12 AS build

COPY app/ /app/

# Compose 编排多容器 + volumes 持久化 + env 注入

    volumes:

      <div class="box tip"><div class="box-title">关键点</div><strong>call_next 前=路由处理前，之后=响应返回后，形成进→处理→出三层</strong></div>
      <p><code class="inline">call_next</code> 前的代码在路由处理前执行，之后的在响应返回后执行，形成"进→处理→出"三层。</p>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
# yield 版中间件的洋葱结构：请求先进后出，响应后进先出
def middleware_1(next_layer):
    def wrapped(req):
        print('① M1 请求前（日志/鉴权）')
        resp = next_layer(req)
        print('⑤ M1 响应后（补响应头）')
        return resp
    return wrapped

def middleware_2(next_layer):
    def wrapped(req):
        print('② M2 请求前')
        resp = next_layer(req)
        print('④ M2 响应后')
        return resp
    return wrapped

def route(req):                     # 最内层 = 路由处理器
    print('③ 路由处理中...')
    return 'Hello!'

app = middleware_1(middleware_2(route))
print('最终响应:', app('GET /threads'))
</pre>

      <pre class="code">routes 收到 PUT /threads/{id}
  → 调 service.update_thread(...)

  → routes 转成响应模型返回</pre>

        <pre class="code">
# route -&gt; service -&gt; repository 简化链路
db = {'101': ('alice', '线程A'), '202': ('bob', '线程B')}

def repo_find_thread(tid):          # 数据层：只查数据，查不到返回 None
    return db.get(tid)

def service_get_thread(tid, user_id):
    row = repo_find_thread(tid)
    if row is None:
        return None                 # 不存在 -&gt; 404（不暴露 ID 是否存在）
    owner, title = row
    if owner != user_id:
        return None                 # 别人的线程 -&gt; 也当"查不到"
    return title

def route(tid, user_id):            # 路由层：只收参数、转发
    return service_get_thread(tid, user_id)

for tid in ['101', '202', '999']:
    print(f'用户 alice 请求 {tid}:', route(tid, 'alice'))
</pre>

    { id:"d2", q:"D2. 密码为什么不能明文存？hash 是什么？", badge:"模块 D", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>hash=单向加密不可逆；注册存哈希、登录比哈希，列名用 password_hash 不存原文</strong></div>
      <p>明文存 = 数据库泄露全部裸奔。hash = <strong>单向加密</strong>：密码 → 固定长度乱码，不可逆。验证时存哈希、比哈希：注册存 <code class="inline">hash(密码)</code>，登录把输入再哈希，两个哈希相等 = 密码对。列名用 <code class="inline">password_hash</code>（存哈希不存原文）。</p>
      <div class="run-example">

        <pre class="code">
import hashlib

def hash_pw(pw, salt='s@lt-2026'):
    return hashlib.sha256((salt + pw).encode()).hexdigest()

h1 = hash_pw('123456')
h2 = hash_pw('123456')
print('同一密码两次哈希一致:', h1 == h2)
print('密文:', h1)
h3 = hash_pw('123457')
print('密码差一位，哈希完全不同:', h1 != h3)
</pre>

    { id:"d4", q:"D4. Thread 加 user_id 外键是干嘛的？为什么 CASCADE？", badge:"模块 D", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>CASCADE=用户删了会话自动跟着删（防孤儿数据）；外键让数据库保证归属不破</strong></div>
      <p>数据隔离：每个会话属于一个用户。<code class="inline">ForeignKey("users.id", ondelete="CASCADE")</code> 意思是——<strong>用户删除时，他的会话由数据库自动跟着删</strong>（级联）。如果不加，用户删了但会话还在，就成了"没主的孤儿数据"。外键的职责：<strong>数据库替你保证数据之间的归属关系不破</strong>，不用代码自己维护。</p>

      </div>` },
    { id:"d4-1", q:"D4.1 三种删除策略对比（实操演示过）", badge:"模块 D", html:`
      <ul>
        <li><strong>NO ACTION / RESTRICT</strong>：有子记录引用时禁止删父（报错 <code class="inline">is still referenced</code>）。要先清光子记录才能删父。适合"子记录是历史证据"的场景（如商品被历史订单引用）。</li>
        <li><strong>CASCADE</strong>：删父时子记录自动跟着删。适合"子记录随主人消亡"的场景（如注销账号连会话一起清）。</li>
        <li><strong>SET NULL</strong>：删父时子记录<strong>保留</strong>，外键列变 NULL（"孤儿"）。适合"子记录可以没爹但得活着"的场景（如评论在用户注销后保留，显示"已注销用户"）。<strong>前提：外键列必须允许 NULL</strong>（不能写 <code class="inline">nullable=False</code>）。</li>
      </ul>
      <div class="box tip"><div class="box-title">记忆</div><strong>NO ACTION = 儿子拦爹；CASCADE = 爹走儿随；SET NULL = 爹走了，儿子改孤儿</strong>。面试常考。实验结论：删父成功与否、子表是否连带变化，全由数据库管，代码不用写——实操三种都跑过，删父后子表分别是"报错 / 清空 / 变空值"。</div>

        <div class="quiz-opt" data-ci="0"><span class="mark"></span>RESTRICT</div>

        <div class="quiz-answer">✅ 子记录可以没爹但得活着 → SET NULL；前提外键列允许 NULL</div>
      </div>` },

import hashlib

users = {'alice': ('s@lt-1', hashlib.sha256(b's@lt-1pw123').hexdigest())}

def login(name, pw):

        return '用户名或密码错误'        # 关键：和密码错误同一句话，防枚举
    salt, h = users[name]
    ok = hashlib.sha256((salt + pw).encode()).hexdigest() == h
    return '登录成功' if ok else '用户名或密码错误'

for name, pw in [('alice', 'pw123'), ('alice', 'x'), ('bob', 'pw123')]:
    print(f'{name} / {pw} -&gt; {login(name, pw)}')

    { id:"g1", q:"G1. 为什么上传要改成\"立即返回 + 后台处理\"？（同步 vs 异步）", badge:"模块 G", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>异步三步：登记 processing → 立即返回 → 后台处理完置 ready/failed；BackgroundTasks 零依赖够用（不引 Celery）</strong></div>
      <p>同步 = 上传接口里直接解析/切块/入库，全跑完才返回——大文件时用户干等，中途失败整个请求 500（分不清是文件坏了还是系统炸了）。异步 = 登记记录（status=processing）→ 接口立刻返回 → 后台慢慢处理 → 完成置 ready / 失败置 failed + error_message。前端轮询状态即可。</p>
      <p>状态机三态：<code class="inline">processing → ready / failed</code>。为什么用 FastAPI BackgroundTasks 而不用 Celery？Celery 要 Redis + 独立进程，对 project5 杀鸡用牛刀；BackgroundTasks 零依赖够用（符合"不一开始追求高并发/微服务"）。</p>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
import asyncio

async def task(name, delay):
    print(f'{name} 开始')
    await asyncio.sleep(delay)      # 等待时让出 CPU，事件循环去跑别人
    print(f'{name} 完成')

async def main():
    await asyncio.gather(
        task('解析文档', 0.4),
        task('生成嵌入', 0.4),
        task('保存入库', 0.4),
    )

print('同步做法要 1.2s；async 并发：')
await main()
print('三个任务并发完成，总耗时约 0.4s')
</pre>

    { id:"r1", q:"雷达1. 为什么 Agent 应用需要可观测性？（意图）", badge:"技术雷达", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>Agent 是决策链不是直线；可观测=给链装行车记录仪，看每次模型/工具调用</strong></div>

    { id:"r5", q:"雷达5. 官方集成用不了，怎么办？——自写回调\"翻译器\"（机制）", badge:"技术雷达", html:`
      <div class="box tip"><div class="box-title">关键点</div><strong>自写回调翻译器：根 chain→trace、子节点→span、LLM→generation、工具→span；回调全包 try/except</strong></div>
      <p>LangGraph/LangChain 每次运行会触发一堆<strong>标准回调钩子</strong>：<code class="inline">on_chain_start/on_llm_start/on_tool_start</code> 等（这是框架稳定 API）。自写的 <code class="inline">LangfuseCallbackHandler</code>（继承 <code class="inline">BaseCallbackHandler</code>）把这些钩子翻译成 Langfuse 的观测对象：</p>
      <ul>
        <li>根 chain（parent_run_id 为空）= 整个图 → 开 <strong>trace</strong></li>
        <li>子 chain（图里的节点）→ trace 下的 <strong>span</strong></li>
        <li>LLM 调用 → <strong>generation</strong>（记模型名 + token 用量）</li>
        <li>工具调用 → <strong>span</strong></li>
      </ul>
      <p>用 LangChain 给的 <code class="inline">run_id</code> 当 key，开始事件建对象、结束事件补 output。回调里全包 try/except——<strong>观测绝不能拖垮 Agent 本体</strong>。</p>
      <div class="run-example">
        <div class="run-head"><span class="run-label">示例 · 可运行</span><button class="run-btn" onclick="runExample(this)">▶ 运行</button></div>
        <pre class="code">
# 微缩版「回调翻译器」：官方集成用不了，就把回调事件翻译成结构化记录
trace = []

def translate(event):
    if event[0] == 'retrieve':
        trace.append(f"span[retrieval] docs={event[1]}")
    elif event[0] == 'llm_start':
        trace.append(f"span[llm] input={event[1][:16]}...")
    elif event[0] == 'llm_end':
        trace.append(f"span[llm] output={event[1][:16]}...")

translate(('retrieve', ['doc1', 'doc2']))
translate(('llm_start', '请根据资料回答：RAG 是什么？'))
translate(('llm_end', 'RAG 是检索增强生成，先检索再生成...'))

print('翻译器产出的 trace：')
for line in trace:
    print(line)
</pre>

/* ================================================================
 * 渲染：左侧树 + 右侧内容
 * ================================================================ */
const ids = [];
const modOf = {};
let modCount = 0;
const treeEl = document.getElementById('tree');
const qasEl = document.getElementById('qas');

MODULES.forEach((top, ti) => {
  // 内容区：每个二级模块 = 一个页面，模块内问题用分隔线区分
  top.groups.forEach(group => {
    const sec = document.createElement('section');
    sec.className = 'modpage';
    const title = document.createElement('div');
    title.className = 'mod-title';
    title.innerHTML = `<span class="mod-lv1">${top.name}</span><span class="mod-arrow">›</span><span class="mod-lv2">${group.name}</span><span class="mod-count">${group.items.length} 条</span>`;
    sec.appendChild(title);
    group.items.forEach((item, gi) => {
      ids.push(item.id);
      modOf[item.id] = sec;
      const art = document.createElement('article');
      art.className = 'qa';
      art.id = item.id;
      art.innerHTML = `
        <span class="badge">${item.badge}</span>
        <h2>${item.q}</h2>
        <div class="qid-line">${item.id}</div>
        <div class="answer">${item.html}</div>`;
      sec.appendChild(art);
      if(gi < group.items.length - 1){
        const sep = document.createElement('hr');
        sep.className = 'qa-sep';
        sec.appendChild(sep);
      }
    });
    qasEl.appendChild(sec);
    modCount++;
  });

  // 导航区：一级分类 → 二级分组
  const topLi = document.createElement('li');
  topLi.className = 'top';
  const topHeader = document.createElement('div');
  topHeader.className = 'top-header';
  const topTotal = top.groups.reduce((n, g) => n + g.items.length, 0);
  topHeader.innerHTML = `<span class="arrow">▼</span><span class="dot"></span><span class="gname">${top.name}</span><span class="gcount">${topTotal}</span>`;
  const topUl = document.createElement('ul');
  topUl.className = 'top-items';
  top.groups.forEach(group => {
    const li = document.createElement('li');
    li.className = 'group';
    const header = document.createElement('div');
    header.className = 'group-header';
    header.innerHTML = `<span class="arrow">▼</span><span class="gname">${group.name}</span><span class="gcount">${group.items.length}</span>`;
    const ul = document.createElement('ul');
    ul.className = 'group-items';
    group.items.forEach(item => {
      const l = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#';
      a.dataset.target = item.id;
      a.innerHTML = `<span class="qid">${item.id}</span>${escapeHtml(item.q.replace(/^[A-Z0-9\-\.\s]+\.\s*/, ''))}`;
      l.appendChild(a);
      ul.appendChild(l);
    });
    li.appendChild(header);
    li.appendChild(ul);
    topUl.appendChild(li);
    header.addEventListener('click', () => li.classList.toggle('collapsed'));
  });
  topLi.appendChild(topHeader);
  topLi.appendChild(topUl);
  treeEl.appendChild(topLi);
  topHeader.addEventListener('click', () => topLi.classList.toggle('collapsed'));
});

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('count').textContent = `共 ${ids.length} 条 · ${modCount} 个页面 · 点左侧查看`;

/* ================================================================
 * 交互：显示条目 / 上一页下一页 / 搜索 / 深浅色 / 移动端
 * ================================================================ */
let current = 0;

function show(id){
  current = ids.indexOf(id);
  document.querySelectorAll('.modpage').forEach(el => el.classList.remove('show'));
  const target = document.getElementById(id);
  if(!target) return;
  const page = modOf[id];
  if(page) page.classList.add('show');
  // 高亮左侧
  document.querySelectorAll('#tree a').forEach(a => a.classList.toggle('active', a.dataset.target === id));
  // 展开所在分组
  const group = document.querySelector(`#tree a[data-target="${id}"]`)?.closest('.group');
  if(group) group.classList.remove('collapsed');
  const top = group?.closest('.top');
  if(top) top.classList.remove('collapsed');
  // 滚动定位到该问题
  target.scrollIntoView({block:'start'});
  renderPager();
}

function renderPager(){
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  const prevName = current > 0 ? ids[current-1] : '';
  const nextName = current < ids.length-1 ? ids[current+1] : '';
  prev.disabled = current <= 0;
  next.disabled = current >= ids.length-1;
  prev.querySelector('.name').textContent = prevName ? `← ${shortLabel(ids[current-1])}` : '已经是第一条';
  next.querySelector('.name').textContent = nextName ? `${shortLabel(ids[current+1])} →` : '已经是最后一条';
}
function shortLabel(id){
  const item = MODULES.flatMap(m => m.groups.flatMap(g => g.items)).find(i => i.id === id);
  return item ? item.q.replace(/^[A-Z0-9\-\.\s]+\.\s*/, '') : id;
}

// 底部翻页按钮
const pager = document.createElement('div');
pager.className = 'pager';
pager.innerHTML = `
  <button id="prevBtn" onclick="go(-1)"><span class="dir">上一页</span><span class="name"></span></button>
  <button id="nextBtn" onclick="go(1)"><span class="dir">下一页</span><span class="name"></span></button>`;
document.querySelector('.content').appendChild(pager);

function go(delta){
  const idx = current + delta;
  if(idx < 0 || idx >= ids.length) return;
  show(ids[idx]);
}

// 树点击
treeEl.addEventListener('click', e => {
  const a = e.target.closest('a[data-target]');
  if(a){ e.preventDefault(); show(a.dataset.target); }
});

// 搜索过滤
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => {
  const kw = searchEl.value.trim().toLowerCase();
  document.querySelectorAll('#tree a').forEach(a => {
    const match = a.textContent.toLowerCase().includes(kw) || a.dataset.target.includes(kw);
    a.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('#tree .group').forEach(g => {
    const any = [...g.querySelectorAll('a')].some(a => a.style.display !== 'none');
    g.style.display = any ? '' : 'none';
    if(any) g.classList.remove('collapsed');
  });
  document.querySelectorAll('#tree .top').forEach(t => {
    const any = [...t.querySelectorAll('.group')].some(g => g.style.display !== 'none');
    t.style.display = any ? '' : 'none';
    if(any) t.classList.remove('collapsed');
  });
});

// 深浅色
function toggleDark(){ document.body.classList.toggle('dark'); }
// 移动端侧边栏
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

// 首屏默认显示第一条
show(ids[0]);

/* 可运行示例：Pyodide 懒加载（第一次点运行才下载，约 5-10s） */
let pyodideReady = null;
function ensurePy(){
  if(!pyodideReady){
    pyodideReady = (async () => {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
        s.onload = res;
        s.onerror = () => rej(new Error('加载 Python 运行时失败，请检查网络后重试'));
        document.head.appendChild(s);
      });
      return loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    })();
  }
  return pyodideReady;
}
async function runExample(btn){
  const ex = btn.closest('.run-example');
  const code = ex.querySelector('pre.code').textContent;
  const out = ex.querySelector('.run-out');
  btn.disabled = true;
  btn.textContent = '加载中…';
  out.style.display = 'block';
  out.textContent = '正在加载 Python 运行时（首次约 5-10s）…';
  try{
    const py = await ensurePy();
    btn.textContent = '运行中…';
    let buf = '';
    py.setStdout({ batched: s => { buf += s + '\n'; out.textContent = buf; } });
    py.setStderr({ batched: s => { buf += '⚠ ' + s + '\n'; out.textContent = buf; } });
    await py.runPythonAsync(code);
    if(!buf.trim()) out.textContent = '（无输出）';
    btn.textContent = '▶ 重跑';
  }catch(err){
    out.textContent = '运行出错：' + (err && err.message ? err.message : err);
    btn.textContent = '▶ 重跑';
  }finally{
    btn.disabled = false;
  }
}

/* 题目测试：点击选项判分 */
document.addEventListener('click', function(e){
  const opt = e.target.closest('.quiz-opt');
  if(!opt || opt.classList.contains('locked')) return;
  const quiz = opt.closest('.quiz');
  const isRight = opt.getAttribute('data-ci') === '1';
  const mark = opt.querySelector('.mark');
  if(isRight){
    opt.classList.add('right','locked');
    mark.textContent = '✓';
  }else{
    opt.classList.add('wrong','locked');
    mark.textContent = '✗';
    const right = quiz.querySelector('.quiz-opt[data-ci="1"]');
    if(right){
      right.classList.add('right','locked');
      right.querySelector('.mark').textContent = '✓';
    }
  }
  const ans = quiz.querySelector('.quiz-answer');
  if(ans) ans.classList.add('show');
});
function showAnswer(btn){
  const quiz = btn.closest('.quiz');
  quiz.querySelectorAll('.quiz-opt').forEach(function(o){ o.classList.add('locked'); });
  const ans = quiz.querySelector('.quiz-answer');
  if(ans) ans.classList.add('show');
}
